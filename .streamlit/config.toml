[theme]
base = "light"
primaryColor = "#365FD5"
backgroundColor = "#F6F8FC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#172137"
font = "sans serif"
headingFont = "sans serif"
baseFontSize = 15
baseRadius = "12px"
buttonRadius = "11px"
showWidgetBorder = true
showSidebarBorder = true
paddingTop = "1.15rem"
paddingBottom = "2rem"

[theme.sidebar]
backgroundColor = "#162644"
secondaryBackgroundColor = "#233859"
textColor = "#E2EAF7"
paddingTop = "1rem"

[client]
toolbarMode = "minimal"

[server]
address = "127.0.0.1"
port = 8507
headless = true
runOnSave = true
fileWatcherType = "poll"
showEmailPrompt = false
maxUploadSize = 100
